<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111827">
<title>Žreb učencev</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.app{width:min(100%,520px);margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
h1{font-size:27px;margin:4px 0 20px;font-weight:800;text-align:center}
label{font-size:14px;font-weight:700;margin-bottom:7px;display:block;color:#4b5563}
select{width:100%;font-size:18px;padding:14px 44px 14px 14px;border:1px solid #d1d5db;border-radius:14px;background:white}
.card{margin-top:18px;background:white;border-radius:24px;padding:30px 18px 24px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.status{font-size:14px;color:#6b7280;min-height:22px}
.name{font-size:clamp(38px,11vw,68px);font-weight:850;line-height:1.05;margin:18px 0 12px;overflow-wrap:anywhere}
.timer{font-variant-numeric:tabular-nums;font-size:14px;color:#9ca3af;min-height:20px}
button{border:0;border-radius:18px;font-size:21px;font-weight:800;padding:17px 24px;width:100%;margin-top:20px;background:#111827;color:white;box-shadow:0 5px 0 #374151;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #374151}
button:disabled{opacity:.55}
.secondary{background:white;color:#111827;border:1px solid #d1d5db;box-shadow:none;font-size:16px;padding:13px;margin-top:12px}
.info{margin-top:18px;text-align:center;color:#6b7280;font-size:13px;line-height:1.45}
.spin{animation:pulse .12s infinite alternate}
@keyframes pulse{from{transform:scale(.98);opacity:.55}to{transform:scale(1.02);opacity:1}}
</style>
</head>
<body>
<div class="app">
  <h1>🎲 Žreb učencev</h1>
  <label for="classSelect">Izberi razred</label>
  <select id="classSelect"></select>

  <div class="card">
    <div class="status" id="status">Pripravljeno</div>
    <div class="name" id="name">Kdo bo danes?</div>
    <div class="timer" id="timer"></div>
  </div>

  <button id="draw">START</button>
  <button class="secondary" id="reset">Ponastavi izbor za ta razred</button>

  <div class="info" id="info"></div>
</div>

<script>
const classes = {"8b-3": ["Alina", "Erazem", "Iza", "Lina", "Naia", "Nina", "Petja", "Ris", "Sebastjan", "Tanay", "Tine", "Tinkara", "Vidan", "Zakaria"], "8b": ["Alina", "Erazem", "Felix", "Iza", "Juna", "Liam", "Lina", "Maša", "Mila", "Naia", "Nina", "Nola", "Olivia", "Petja", "Ris", "Samo", "Sebastjan", "Tanay", "Taras", "Tayra", "Tine", "Tinkara", "Tom", "Ula", "Vidan", "Vitan", "Zakaria", "Zala"], "8b-4": ["Samo", "Maša", "Tom", "Olivia", "Mila", "Taras", "Vitan", "Nola", "Tayra", "Zala", "Juna", "Liam", "Ula", "Felix"], "8c": ["Aleksandar", "Anur", "Bela", "David", "Dora", "Ella", "Gal", "Hana", "Jaka", "Jon", "Julija", "Jurij", "Kaja", "Laila", "Lev", "Maj", "Nika", "Nikita", "Nikolina", "Samo", "Svarun Alojz", "Tija", "Tim", "Tinkara D.", "Tinkara H.", "Urška", "Vera", "Zoja"], "6b": ["Brin", "Maiia", "Marina", "Zarja", "Maja", "Iva", "Teo", "Anes", "Luka", "Jan", "Choi Dan", "Makar", "Zoja", "Julija", "Alina", "Katarina", "Mila P.", "Nana", "Ava", "Aleksandr", "Kim", "Roko", "Mila V.", "Alja", "Aleksander", "Anabela", "Kajetan"]};
const select = document.getElementById('classSelect');
const nameEl = document.getElementById('name');
const statusEl = document.getElementById('status');
const timerEl = document.getElementById('timer');
const infoEl = document.getElementById('info');
const drawBtn = document.getElementById('draw');
const resetBtn = document.getElementById('reset');

const SESSION_MS = 45 * 60 * 1000;
let bag = [];
let selected = [];
let sessionStarted = null;
let busy = false;
let countdown = null;

Object.keys(classes).forEach(c => {
  const o = document.createElement('option');
  o.value = c; o.textContent = c.toUpperCase().replace('-', ' – ');
  select.appendChild(o);
});

function key() { return 'zreb_' + select.value; }

function load() {
  try {
    const raw = localStorage.getItem(key());
    if (raw) {
      const d = JSON.parse(raw);
      if (Date.now() - d.started < SESSION_MS) {
        bag = d.bag || [];
        selected = d.selected || [];
        sessionStarted = d.started;
      } else clearState();
    }
  } catch(e) {}
  updateInfo();
  updateTimer();
}

function save() {
  localStorage.setItem(key(), JSON.stringify({bag,selected,started:sessionStarted}));
}

function clearState() {
  bag = [...classes[select.value]];
  selected = [];
  sessionStarted = Date.now();
  save();
  updateInfo();
  updateTimer();
}

function shuffle(a) {
  for (let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function updateInfo() {
  const total = classes[select.value].length;
  infoEl.textContent = selected.length
    ? `Izžrebanih: ${selected.length} / ${total} · brez ponavljanja`
    : `V razredu je ${total} učencev. V 45 minutah se ime ne ponovi.`;
}

function updateTimer() {
  clearInterval(countdown);
  if (!sessionStarted) { timerEl.textContent=''; return; }
  const tick = () => {
    const left = Math.max(0, SESSION_MS - (Date.now()-sessionStarted));
    const m = Math.floor(left/60000), s = Math.floor((left%60000)/1000);
    timerEl.textContent = `Seja: ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (left === 0) {
      clearState();
      statusEl.textContent = '45 minut je minilo – izbor je ponastavljen.';
    }
  };
  tick(); countdown=setInterval(tick,1000);
}

select.addEventListener('change', () => {
  nameEl.textContent='Kdo bo danes?';
  statusEl.textContent='Pripravljeno';
  load();
});

resetBtn.addEventListener('click', () => {
  if (confirm('Ponastavim izbor za ta razred?')) {
    clearState();
    nameEl.textContent='Kdo bo danes?';
    statusEl.textContent='Pripravljeno';
  }
});

drawBtn.addEventListener('click', async () => {
  if (busy) return;
  busy = true;
  drawBtn.disabled = true;

  if (!sessionStarted || Date.now()-sessionStarted >= SESSION_MS) clearState();
  if (!bag.length) {
    bag = [...classes[select.value]];
    selected = [];
    sessionStarted = Date.now();
  }

  statusEl.textContent='Žrebam …';
  nameEl.classList.add('spin');

  const names = [...classes[select.value]];
  const start = performance.now();
  while (performance.now()-start < 5000) {
    nameEl.textContent = names[Math.floor(Math.random()*names.length)];
    await new Promise(r=>setTimeout(r,100));
  }

  const chosen = bag.pop();
  selected.push(chosen);
  nameEl.textContent = chosen;
  nameEl.classList.remove('spin');
  statusEl.textContent='Izbran/a učenec/učenka';
  save();
  updateInfo();

  busy = false;
  drawBtn.disabled = false;
});
load();
</script>
</body>
</html>
